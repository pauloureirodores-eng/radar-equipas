name: Weekly Data Refresh

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl tabulate

      - name: Rebuild analyzer outputs
        run: |
          python analisar_equipas.py --csv-dir . --outdir output --min-games 5 --lay

      - name: Build website data JSON
        run: |
          python scripts/build_site_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output site/data/site-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): weekly refresh"
          git push
